services:
  postgres:
    image: postgres:16
    container_name: metis_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - metis_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metis_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${API_PORT}:${INTERNAL_API_PORT}"
    environment:
      - API_PORT=${API_PORT}
      - POSTGRES_URL=${POSTGRES_URL}
      - BACKEND_URL=${BACKEND_URL}
      - NODE_ENV=DEVELOPMENT
      - INTERNAL_API_PORT=${INTERNAL_API_PORT}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  metis_data:
