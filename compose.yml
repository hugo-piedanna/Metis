services:
  mongo:
    image: mongo:latest
    container_name: metis_mongodb
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - metis_mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    command:
      - "--logpath"
      - "/var/log/mongodb/mongod.log"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metis_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${API_PORT}:${INTERNAL_API_PORT}"
    environment:
      - API_PORT=${API_PORT}
      - MONGO_URL=${MONGO_URL}
      - BACKEND_URL=${BACKEND_URL}
      - NODE_ENV=DEVELOPMENT
      - INTERNAL_API_PORT=${INTERNAL_API_PORT}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  metis_mongodb_data:
