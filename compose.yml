services:
  postgres:
    image: postgres:16
    container_name: metis_postgres
    ports:
      - "5432:5432"
    volumes:
      - metis_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metis_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "9000:9000"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - NODE_ENV=DEVELOPMENT
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  metis_data:
